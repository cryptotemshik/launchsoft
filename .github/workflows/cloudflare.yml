name: Deploy to Cloudflare Pages

# Publishes the built app to the existing `launchpad` Pages project, so the
# site keeps the address it already has: https://launchpad-44c.pages.dev
#
# Cloudflare's own Git integration cannot be added to a project that was first
# deployed from the CLI — it only works on a project created from a repository,
# which would mean a new project and a new address. This does the same job from
# the other side: GitHub builds the site and hands it to Pages.
#
# Two repository secrets are needed (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — a token with Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  — the account the project lives in

on:
  push:
    branches: [claude/pensive-ramanujan-w5cpew]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A red test never reaches the site: the deploy step doesn't run.
      - run: npm test
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=launchpad --branch=main
