# Cloudflare Pages config — makes `npx wrangler pages deploy` work with no flags.
name = "launchpad"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-19"

# Deploy (production serves app.orvex.cash):
#   CLOUDFLARE_API_TOKEN=<Pages:Edit token> \
#   CLOUDFLARE_ACCOUNT_ID=fa5ae3ac62aebb4f2770386cf90cc55f \
#   npx wrangler pages deploy dist --project-name launchpad --branch main
#
# The account id is not a secret (it's an identifier), but Pages' wrangler.toml
# rejects an `account_id` field, so it goes in the env var above. A Pages:Edit
# token can't enumerate accounts, which is why the id must be supplied at all.
